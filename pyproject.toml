# Tooling configuration only -- the app is run with `streamlit run app.py`,
# not installed as a package.

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [".venv", ".archive_legacy", "data"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "S",    # flake8-bandit (security)
    "C4",   # comprehensions
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # long lines are handled by the formatter, not enforced
    "B008",    # function call in default argument -- not a pattern used here
    "RUF001",  # ambiguous unicode: this project is full of legitimate French text
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use assert, hard-coded sample values and private access.
"tests/*" = ["S101", "S105", "S106", "SLF001"]
# Preprocessing scripts print progress and read local files by design.
"scripts/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
